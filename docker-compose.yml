# jSuite edge — one container: Caddy as the front door for the suite.
#
#   https://jsuite.local  -> static index (./www)
#   https://jticket.local -> host :43000
#   https://jdiff.local   -> host :43002
#   (see Caddyfile for the full map)
#
# OrbStack does the heavy lifting: the dev.orbstack.domains label below makes
# OrbStack resolve the .local names to this container's IP, terminate HTTPS
# with its auto-trusted local CA, and forward plain HTTP to Caddy on :80.
# No published ports, no certs, no /etc/hosts. The apps run natively on the
# host (started by ./jsuite), so they keep full filesystem + gh/git/claude
# access. This container only routes by Host header.
#
# Don't run this by hand — `./jsuite start` brings it up together with the apps.
services:
  caddy:
    image: caddy:2-alpine
    container_name: jsuite-edge
    restart: unless-stopped
    labels:
      # Every name here must have a matching site block in the Caddyfile.
      dev.orbstack.domains: jsuite.local,jticket.local,jdiff.local,jchart.local,jexplain.local
      # Skip OrbStack's port auto-detection — Caddy listens on 80.
      dev.orbstack.http-port: "80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      # Portability: guarantees host.docker.internal resolves to the host even
      # off Docker Desktop (where it is provided automatically).
      - "host.docker.internal:host-gateway"

volumes:
  caddy_data:
  caddy_config:
